id: RC-000001
title: "Two-map Cycle-Scale affine IFS — Invariant Set S = [0,1]³"
type: lemma
domain: dynamical_systems / iterated_function_systems
author: "S.S. Duymt / maitheduy"
organization: "ACI University"
created_at: "2026-10-27"

claim: |
  For the IFS consisting of two affine maps:
    f₁(x,y,z) = (z, x/2, y)
    f₂(x,y,z) = (z, x/2 + 1/2, y)
  The set S = [0,1]³ is an invariant set, meaning:
    f₁(S) ∪ f₂(S) = S

method: "Coefficient Matching"
invariant_set: "S = [0,1]^3"

verification:
  status: "PASSED_LEAN_GATE"
  engine: "Lean 4"
  note: "Verified by Lean Kernel"

limitations:
  - "Only applies to 2-map Cycle-Scale affine IFS"
  - "Set S cannot yet be replaced by a cubic curve"

challenge: |
  OPEN CHALLENGE:
  Question: Can we find parameters for a 2-map Cycle-Scale affine IFS 
  such that the invariant set S is a SOLID TETRAHEDRON instead of a cube?
  
  Suggested approach:
  - Find more general Cycle-Scale affine maps f₁, f₂
  - Identify 4 vertices of the target tetrahedron
  - Prove f₁(S) ∪ f₂(S) = S where S is a tetrahedron
  - Formalize the result in Lean
  
  Reward: The new RC will be labeled "RESOLVED_CHALLENGE" and linked 
  back to RC-000001

tags:
  - IFS
